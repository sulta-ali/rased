<script>(function () {
  "use strict";
  const root = document.getElementById("app");
  const key = "rased-offline-demo-v1";
  const nextDate = days => new Date(Date.now() + days * 86400000).toISOString();
  const fresh = () => ({
    accounts: [], current: null, registrations: [], issues: [],
    seminars: [
      {id:"s1", title:"سيمينار تجريبي: الطاقة الذكية", description:"مثال للتعرّف على طريقة التسجيل والحضور في رصيد.", startsAt:nextDate(7), place:"قاعة كلية الهندسة · مثال", checkinOpen:true, certificateReady:true, isDemo:true},
      {id:"s2", title:"سيمينار تجريبي: الشبكات الكهربائية", description:"تعرّف على تطبيقات الشبكات الحديثة وإدارة الطاقة.", startsAt:nextDate(12), place:"قاعة الهندسة الكهربائية · مثال", checkinOpen:true, certificateReady:true, isDemo:true},
      {id:"s3", title:"سيمينار تجريبي: أنظمة التحكم", description:"نموذج توضيحي لسيمينار يمكن للطالب التسجيل فيه.", startsAt:nextDate(18), place:"المسرح الجامعي · مثال", checkinOpen:true, certificateReady:false, isDemo:true}
    ]
  });
  let db;
  try { db = JSON.parse(localStorage.getItem(key) || "null") || fresh(); } catch { db = fresh(); }
  if (!Array.isArray(db.accounts) || !Array.isArray(db.seminars)) db = fresh();
  const ui = {mode:"signup", role:"student", view:"home", message:"", tone:"success", scanId:null, stream:null, scanning:false};
  const id = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
  const code = () => "RSD-" + id().replace(/-/g, "").slice(0,12).toUpperCase();
  const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const fmt = date => new Intl.DateTimeFormat("ar-SA", {dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Riyadh"}).format(new Date(date));
  const status = value => ({registered:"مسجّل للحضور",pending:"تم استلام الحضور · بانتظار الاعتماد",approved:"تم الاعتماد والاحتساب",rejected:"لم يُعتمد الحضور"}[value] || value);
  const current = () => db.accounts.find(a => a.id === db.current) || null;
  const seminar = reg => db.seminars.find(s => s.id === reg.seminarId);
  const mine = () => db.registrations.filter(r => r.accountId === db.current);
  function persist() {
    try { localStorage.setItem(key, JSON.stringify(db)); }
    catch { ui.message = "المتصفح منع حفظ البيانات. أبقِ الصفحة مفتوحة أثناء العرض."; ui.tone = "error"; }
  }
  function tell(message, tone="success") { ui.message=message; ui.tone=tone; render(); }
  function head(title, detail) { return `<div class="heading"><h1>${title}</h1><p>${detail}</p></div>`; }
  function navButton(view, title) { return `<button type="button" data-action="go" data-view="${view}" class="${ui.view===view?"selected":""}">${title}</button>`; }
  function card(s) {
    const reg = mine().find(r => r.seminarId === s.id);
    return `<article class="card"><span class="pill">${s.isDemo?"سيمينار تجريبي":"سيمينار"}</span><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><div class="meta"><span>◷ ${fmt(s.startsAt)}</span><span>⌖ ${esc(s.place)}</span></div>${reg
      ? `<div class="card-actions"><span class="status ${reg.status}">${status(reg.status)}</span><button class="outline" data-action="go" data-view="record">عرض كودي وسجلي</button></div>`
      : `<button class="primary full" data-action="register" data-id="${s.id}">سأحضر</button>`}</article>`;
  }
  function auth() {
    return `<section class="auth-layout"><div class="auth-intro"><span class="pill">نسخة عرض عامة</span><h1>تابع رصيد حضورك بوضوح.</h1><p>اختر صفتك للتجربة: الطالب يتابع حضوره، والمسؤول ينظّم السيمينارات ويعتمد الحضور.</p><div class="auth-steps"><span>التسجيل في السيمينار</span><span>توثيق الحضور لدى المشرف</span><span>متابعة العداد والشهادة</span></div></div>
      <div class="panel auth-card"><div class="auth-switch"><button class="${ui.mode==="signup"?"active":""}" data-action="mode" data-value="signup">إنشاء حساب</button><button class="${ui.mode==="login"?"active":""}" data-action="mode" data-value="login">تسجيل الدخول</button></div>
      <h2>${ui.mode==="signup"?"إنشاء حساب تجريبي":"تجربة الدخول"}</h2>
      <form data-form="auth"><span class="role-label">أجرب الموقع بصفتي</span><div class="role-options" role="group" aria-label="نوع الحساب"><button type="button" class="${ui.role==="student"?"active":""}" data-action="role" data-value="student">طالب</button><button type="button" class="${ui.role==="admin"?"active":""}" data-action="role" data-value="admin">مسؤول</button></div>
      ${ui.mode==="signup" ? `<label>الاسم الكامل<input name="name" required maxlength="80" placeholder="${ui.role==="student"?"اسم الطالب":"اسم المسؤول"}"></label>${ui.role==="student"?'<label>الرقم الجامعي<input name="studentNumber" required maxlength="30" placeholder="الرقم الجامعي"></label>':""}` : ""}
      <label>الإيميل<input name="email" required maxlength="254" placeholder="أي إيميل للتجربة" dir="ltr"></label>
      ${ui.mode==="signup" ? '<label>رقم الجوال<input name="phone" required maxlength="35" placeholder="أي رقم للتجربة" dir="ltr"></label>' : ""}
      <label>كلمة المرور<input name="password" required type="password" maxlength="128" placeholder="أي كلمة للتجربة" dir="ltr"></label>
      <button class="primary full" type="submit">${ui.mode==="signup"?"إنشاء حسابي":"دخول"}</button></form><p class="auth-footnote">اختيار «مسؤول» متاح للجميع للتجربة. كلمة المرور لا تُحفظ. البيانات تبقى في هذا المتصفح على جهازك، ولا تمثل سجلات الجامعة.</p></div></section>`;
  }
  function home(a) {
    const count = mine().filter(r => r.status==="approved").length;
    return `<section class="hero"><div class="score"><div><b>${count}</b><span>من 13</span></div><div class="track"><i style="width:${Math.min(count/13*100,100)}%"></i></div><p>${count>=13?"أكملت العدد المطلوب للتجربة":`باقي لك ${13-count} سيمينار`}</p></div><div class="hero-copy"><small>سيمينارات الهندسة الكهربائية</small><h1>أهلًا، ${esc(a.name)}</h1><p>سجّل، وثّق حضورك، وتابع ما احتُسب لك في مكان واحد.</p></div></section>
      <div class="section-title"><div><h2>السيمينارات القادمة</h2><p>اختر السيمينار المناسب وسجّل رغبتك.</p></div><button class="quiet" data-action="go" data-view="seminars">عرض الكل</button></div><div class="cards">${db.seminars.slice(0,3).map(card).join("")}</div>`;
  }
  function record() {
    const regs = mine();
    return head("سجلي","اعرض كودك للمسؤول عند وصولك، وتابع اعتماد حضورك هنا.") + (regs.length ? `<div class="stack">${regs.map(r => {
      const s=seminar(r); if (!s) return "";
      return `<article class="record"><div><span class="status ${r.status}">${status(r.status)}</span><h3>${esc(s.title)}</h3><p>${fmt(s.startsAt)} · ${esc(s.place)}</p>
      ${r.status==="registered"? `<div class="student-qr"><img data-qr="${esc(r.code)}" alt="رمز QR الخاص بهذا التسجيل"><b dir="ltr">${esc(r.code)}</b><p>اعرض الرمز للمسؤول؛ لا يُحتسب الحضور قبل اعتماده.</p></div>`:""}
      ${r.status==="pending"?'<p class="receipt">تم استلام الكود، بانتظار اعتماد المسؤول.</p>':""}
      ${r.status==="rejected"?`<p class="reject">سبب عدم الاعتماد: ${esc(r.reason||"لم يحدد")}</p>`:""}
      ${r.status==="approved"?`<p class="hint">طريقة الاعتماد: ${r.method==="manual"?"يدوي":"مسح الكود"}</p>`:""}</div>
      <div class="record-actions">${r.status==="approved"&&s.certificateReady?`<button class="primary" data-action="certificate" data-id="${r.id}">تحميل شهادة تجريبية</button>`:""}<button class="quiet" data-action="report" data-id="${s.id}">عندي مشكلة</button></div></article>`;
    }).join("")}</div>` : '<div class="empty">ما سجّلت في أي سيمينار بعد.<br><button class="primary" data-action="go" data-view="seminars">استعرض السيمينارات</button></div>');
  }
  function profile(a) {
    return head("حسابي",a.role==="admin"?"حساب المسؤول التجريبي.":"بيانات تجربتك وتقدمك محفوظة في هذا المتصفح.") +
      `<div class="panel narrow account-details"><h2>${esc(a.name)}</h2><dl>${a.role==="student"?`<div><dt>الرقم الجامعي</dt><dd>${esc(a.studentNumber||"—")}</dd></div>`:""}<div><dt>الإيميل</dt><dd dir="ltr">${esc(a.email)}</dd></div><div><dt>رقم الجوال</dt><dd dir="ltr">${esc(a.phone||"—")}</dd></div></dl><p class="hint">التذكيرات واستعادة كلمة المرور غير مفعّلة في نسخة العرض.</p><button class="outline" data-action="logout">تسجيل الخروج</button></div>`;
  }
  function support() {
    return head("الإبلاغ عن مشكلة","حدد السيمينار واشرح ما حصل ليتمكن المسؤول من مراجعة البلاغ.") +
      `<form class="panel narrow" data-form="issue"><label>السيمينار<select name="seminarId"><option value="">مشكلة عامة</option>${db.seminars.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join("")}</select></label><label>وصف المشكلة<textarea name="message" required minlength="5" maxlength="1200" rows="5" placeholder="مثال: حضرت السيمينار لكن لم يظهر حضوري"></textarea></label><button class="primary">إرسال البلاغ</button></form>`;
  }
  function admin() {
    const pending=db.registrations.filter(r=>r.status==="pending").length;
    const approved=db.registrations.filter(r=>r.status==="approved").length;
    return `<div class="admin-view"><button class="outline" data-action="logout">تسجيل الخروج</button>
      ${head("أنت الآن في واجهة المشرف التجريبية","اقرأ كود الطالب، طابق اسمه ورقمه الجامعي، ثم اعتمد حضوره.")}
      <p class="admin-note">الإجراءات تجريبية وليست اعتمادًا رسميًا من الجامعة. لا يمكن للطالب اعتماد حضوره بنفسه.</p>
      <div class="stats"><div><b>${db.registrations.length}</b><span>تسجيل</span></div><div><b>${pending}</b><span>بانتظار الاعتماد</span></div><div><b>${approved}</b><span>معتمد تجريبيًا</span></div></div>
      <h2>قراءة كود الطالب</h2><div class="panel narrow"><p>افتح الحضور للسيمينار أولًا، ثم اقرأ رمز QR بكاميرا الجهاز أو أدخل الكود المكتوب تحته.</p>
      <button class="primary" data-action="camera">فتح الكاميرا لمسح الكود</button><div id="camera-box" class="camera-box"></div>
      <form data-form="scan"><label>إدخال الكود<input name="code" required placeholder="RSD-XXXXXXXXXXXX" dir="ltr"></label><button class="outline">البحث عن الطالب</button></form>
      ${ui.scanId? scanConfirmation():""}</div>
      <h2>إضافة سيمينار</h2><form class="panel admin-form" data-form="seminar"><label>اسم السيمينار<input name="title" required maxlength="100"></label><label>الموعد<input name="startsAt" required type="datetime-local"></label><label>المكان<input name="place" required maxlength="100"></label><label class="wide">وصف مختصر<textarea name="description" maxlength="400" rows="2"></textarea></label><button class="primary">إضافة السيمينار</button></form>
      <h2>السيمينارات</h2><div class="admin-events">${db.seminars.map(s=>`<div class="panel admin-event"><div><span class="pill">${s.isDemo?"مثال تجريبي":"سيمينار"}</span><h3>${esc(s.title)}</h3><p>${fmt(s.startsAt)} · ${esc(s.place)}</p><div class="admin-buttons"><button class="outline" data-action="checkin" data-id="${s.id}">${s.checkinOpen?"إغلاق مسح الحضور":"فتح مسح الحضور"}</button><button class="outline" data-action="cert" data-id="${s.id}">${s.certificateReady?"إيقاف الشهادة":"إتاحة الشهادة التجريبية"}</button></div></div><span class="status ${s.checkinOpen?"approved":"registered"}">${s.checkinOpen?"المسح مفتوح":"المسح مغلق"}</span></div>`).join("")}</div>
      <h2>اعتماد يدوي عند تعذّر المسح</h2><label class="search-label">ابحث بالاسم أو الرقم الجامعي<input id="search" placeholder="اسم المشارك أو رقمه"></label>
      <div class="stack">${db.registrations.map(r=>{const a=db.accounts.find(a=>a.id===r.accountId),s=seminar(r);return `<div class="record registration-row" data-search="${esc((a?.name||"")+" "+(a?.studentNumber||""))}"><div><span class="status ${r.status}">${status(r.status)}</span><h3>${esc(a?.name||"طالب")}</h3><p>${esc(a?.studentNumber||"رقم غير مضاف")} · ${esc(s?.title||"")}</p></div>${["registered","pending"].includes(r.status)?`<div class="review-actions"><button class="primary" data-action="manual" data-id="${r.id}">اعتماد يدوي</button><button class="outline" data-action="reject" data-id="${r.id}">عدم الاعتماد</button></div>`:""}</div>`}).join("") || '<div class="empty">لا توجد طلبات حضور بعد.</div>'}</div>
      <h2>البلاغات</h2><div class="stack">${db.issues.map(i=>`<div class="record"><div><h3>${esc(db.accounts.find(a=>a.id===i.accountId)?.name||"طالب")} · ${esc(db.seminars.find(s=>s.id===i.seminarId)?.title||"مشكلة عامة")}</h3><p>${esc(i.message)}</p><small>${fmt(i.createdAt)}</small></div></div>`).join("") || '<div class="empty">لا توجد بلاغات بعد.</div>'}</div></div>`;
  }
  function scanConfirmation() {
    const r=db.registrations.find(x=>x.id===ui.scanId),a=db.accounts.find(x=>x.id===r?.accountId),s=r&&seminar(r);
    if (!r || !a || !s) return "";
    return `<div class="scan-confirm"><span class="status pending">بانتظار قرارك</span><h3>${esc(a.name)}</h3><p>الرقم الجامعي: ${esc(a.studentNumber)}</p><p>السيمينار: ${esc(s.title)}</p><button class="primary" data-action="approve" data-id="${r.id}">اعتماد حضور الطالب</button><button class="quiet" data-action="clearScan">إغلاق</button></div>`;
  }

  function register(seminarId) {
    if (current()?.role!=="student") return;
    if (db.registrations.some(r=>r.accountId===db.current&&r.seminarId===seminarId)) return;
    db.registrations.push({id:id(),accountId:db.current,seminarId,status:"registered",code:code(),reason:"",method:""});
    persist(); tell("تم تسجيل رغبتك. تجد كودك في «سجلي»، والحضور لا يُحتسب إلا بعد اعتماد المسؤول.");
  }
  function receive(raw) {
    const c=String(raw||"").trim().toUpperCase().replace(/^RASED:/,"");
    const r=db.registrations.find(x=>x.code===c);
    if (!r) return tell("هذا الكود غير موجود في نسخة العرض في هذا المتصفح.","error");
    const s=seminar(r);
    if (!s?.checkinOpen) return tell("افتح مسح الحضور لهذا السيمينار أولًا.","error");
    if (r.status==="approved") return tell("حضور هذا الطالب معتمد مسبقًا.","error");
    r.status="pending"; r.method="scan"; ui.scanId=r.id; persist();
    stopCamera(); tell("تم استلام كود الطالب. راجع بياناته ثم اعتمد الحضور.");
  }
  function stopCamera() {
    ui.scanning=false;
    if (ui.stream) { ui.stream.getTracks().forEach(track=>track.stop()); ui.stream=null; }
  }
  async function camera() {
    if (!navigator.mediaDevices?.getUserMedia || !window.BarcodeDetector) return tell("الكاميرا أو قراءة QR غير مدعومة هنا. أدخل الكود المكتوب تحت رمز الطالب أو اعتمد الحضور يدويًا.","error");
    try {
      const detector=new BarcodeDetector({formats:["qr_code"]});
      ui.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
      const box=document.getElementById("camera-box");
      box.innerHTML='<video autoplay playsinline muted style="max-width:100%;border-radius:12px"></video><button class="quiet" data-action="stopCamera">إغلاق الكاميرا</button>';
      const video=box.querySelector("video");
      video.srcObject=ui.stream; ui.scanning=true;
      async function read() {
        if (!ui.scanning) return;
        try { const results=await detector.detect(video); if (results[0]?.rawValue) { receive(results[0].rawValue); return; } } catch {}
        if (ui.scanning) requestAnimationFrame(read);
      }
      video.addEventListener("loadeddata",read,{once:true});
    } catch { stopCamera(); tell("تعذر فتح الكاميرا. استخدم إدخال الكود أو الاعتماد اليدوي.","error"); }
  }
  function certificate(regId) {
    const r=db.registrations.find(x=>x.id===regId),s=r&&seminar(r),a=current();
    if (!r || !s || !a || r.accountId!==a.id || r.status!=="approved" || !s.certificateReady) return;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790"><rect width="1120" height="790" fill="#f7fbfd"/><rect x="32" y="32" width="1056" height="726" rx="26" fill="white" stroke="#0a4263" stroke-width="5"/><rect x="48" y="48" width="1024" height="694" rx="18" fill="none" stroke="#e97825" stroke-width="2"/><g text-anchor="middle" font-family="Tahoma, Arial, sans-serif" fill="#0a4263"><text x="560" y="158" font-size="54" font-weight="bold">رصيد - RASED</text><text x="560" y="238" font-size="30">شهادة حضور تجريبية</text><text x="560" y="332" font-size="27">تشهد نسخة العرض بحضور</text><text x="560" y="400" font-size="40" font-weight="bold">${esc(a.name)}</text><text x="560" y="470" font-size="28">${esc(s.title)}</text><text x="560" y="530" font-size="22">${esc(fmt(s.startsAt))}</text><text x="560" y="650" font-size="19" fill="#926146">هذه شهادة تجريبية وليست وثيقة صادرة من الجامعة</text></g></svg>`;
    const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
    const link=document.createElement("a");link.href=url;link.download="RASED-demo-certificate.svg";link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  root.addEventListener("click",e=>{
    const btn=e.target.closest("[data-action]");if (!btn) return;
    const {action,id:targetId,value,view}=btn.dataset;
    if (action==="mode") {ui.mode=value;render();}
    if (action==="role") {ui.role=value;render();}
    if (action==="go") {stopCamera();ui.view=view;ui.message="";render();window.scrollTo(0,0);}
    if (action==="logout") {stopCamera();db.current=null;ui.scanId=null;ui.mode="login";ui.message="";persist();render();}
    if (action==="register") register(targetId);
    if (action==="clearNotice") {ui.message="";render();}
    if (action==="camera") camera();
    if (action==="stopCamera") {stopCamera();document.getElementById("camera-box").innerHTML="";}
    if (action==="clearScan") {ui.scanId=null;render();}
    if (action==="approve" || action==="manual") {
      const r=db.registrations.find(x=>x.id===targetId);
      if (!r || current()?.role!=="admin") return;
      if (action==="manual" && !confirm("هل طابقت بيانات الطالب وحضوره؟")) return;
      r.status="approved";r.method=action==="manual"?"manual":"scan";ui.scanId=null;persist();tell("تم اعتماد حضور الطالب تجريبيًا.");
    }
    if (action==="reject") {
      const r=db.registrations.find(x=>x.id===targetId);
      if (!r || current()?.role!=="admin") return;
      const reason=prompt("اكتب سبب عدم الاعتماد:");if (!reason?.trim()) return;
      r.status="rejected";r.reason=reason.trim().slice(0,250);ui.scanId=null;persist();tell("سُجّل سبب عدم الاعتماد.");
    }
    if (action==="checkin" || action==="cert") {
      const s=db.seminars.find(x=>x.id===targetId);if (!s || current()?.role!=="admin") return;
      if (action==="checkin") s.checkinOpen=!s.checkinOpen; else s.certificateReady=!s.certificateReady;
      persist();tell("تم حفظ تغيير السيمينار.");
    }
    if (action==="certificate") certificate(targetId);
    if (action==="report") {ui.view="support";render();root.querySelector('[name="seminarId"]').value=targetId;}
  });
  root.addEventListener("input",e=>{
    if (e.target.id!=="search") return;
    const query=e.target.value.trim().toLowerCase();
    root.querySelectorAll(".registration-row").forEach(row=>row.hidden=!row.dataset.search.toLowerCase().includes(query));
  });
  root.addEventListener("submit",e=>{
    const form=e.target.closest("[data-form]");if (!form) return;
    e.preventDefault();const values=Object.fromEntries(new FormData(form).entries());
    if (form.dataset.form==="auth") {
      const email=String(values.email||"").trim();
      if (ui.mode==="signup") {
        const a={id:id(),role:ui.role,name:String(values.name||"").trim(),studentNumber:String(values.studentNumber||"").trim(),email,phone:String(values.phone||"").trim()};
        if (!a.name || (ui.role==="student"&&!a.studentNumber)) return tell("أكمل بيانات الحساب.","error");
        db.accounts.push(a);db.current=a.id;
      } else {
        const existing=db.accounts.find(a=>a.email.toLowerCase()===email.toLowerCase()&&a.role===ui.role);
        if (existing) db.current=existing.id;
        else {
          const a={id:id(),role:ui.role,name:email.split("@")[0]||"مشارك تجريبي",studentNumber:"",email,phone:""};
          db.accounts.push(a);db.current=a.id;
        }
      }
      ui.view=ui.role==="admin"?"admin":"home";persist();tell(ui.role==="admin"?"مرحبًا بك في لوحة المسؤول التجريبية.":"مرحبًا بك في رصيد، يمكنك التسجيل في السيمينارات.");
    }
    if (form.dataset.form==="scan") receive(values.code);
    if (form.dataset.form==="seminar") {
      if (current()?.role!=="admin") return;
      const d=new Date(values.startsAt);if (Number.isNaN(d.getTime())) return tell("حدد موعدًا صحيحًا.","error");
      db.seminars.push({id:id(),title:String(values.title).trim().slice(0,100),description:String(values.description||"").trim().slice(0,400),startsAt:d.toISOString(),place:String(values.place).trim().slice(0,100),checkinOpen:false,certificateReady:false,isDemo:false});
      persist();tell("أُضيف السيمينار. افتح مسح الحضور عندما يبدأ.");
    }
    if (form.dataset.form==="issue") {
      db.issues.push({id:id(),accountId:db.current,seminarId:values.seminarId||null,message:String(values.message).trim().slice(0,1200),createdAt:new Date().toISOString()});
      persist();tell("وصل بلاغك إلى لوحة المسؤول التجريبية.");
    }
  });
  render();
})();
</script>
</body></html>
